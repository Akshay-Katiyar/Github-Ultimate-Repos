name: "🐛 Bug Report"
description: Report an issue, incorrect metadata, or broken workflow in Github Ultimate Repos
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: input
    id: repo_target
    attributes:
      label: Repository or Asset Affected
      description: Which repository, script, or documentation file is affected?
      placeholder: "e.g. huggingface/transformers or scripts/cli/ultimate_agent_cli.py"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug and what you observed.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Environment
      description: What operating system and Python version are you using?
      placeholder: "e.g. Windows 11, Python 3.12"
