name: Security & Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit

permissions:
  contents: read

jobs:
  security-audit:
    name: AST Security, Secrets & Injection Prevention Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Enterprise Static Security & AST Audit
        run: |
          python scripts/validation/security_audit.py
