name: Catalog & Registry Synchronization Audit

on:
  push:
    paths:
      - 'starred_repos_master_catalog.csv'
      - 'STARRED_REPOSITORIES_CATEGORIZED_LIST.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-audit:
    name: Verify Registry Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Integrity Sync Check
        run: |
          python -c "
          import csv, sys
          with open('starred_repos_master_catalog.csv', 'r', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          print(f'Verified master catalog row count: {len(rows):,}')
          assert len(rows) == 11730, f'Expected 11730 rows, got {len(rows)}'
          "

      - name: Verify SQLite FTS5 Database Compilation
        run: |
          python scripts/inventory/build_sqlite_registry.py
